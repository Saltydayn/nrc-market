# The market website: site files as static assets + this Worker for /data/.
# Deployed by .github/workflows/deploy-site.yml, which copies the site into ./public first.
# No workers.dev address: the only way in is naga-rave-cave.pages.dev/market/ (guild login),
# through the guild site's service binding MARKET_SITE.
name = "nrc-market-site"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "MARKET"
bucket_name = "nrc-market"
