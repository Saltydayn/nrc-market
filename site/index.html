<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#15130f">

  <title>NRC Market</title>
  <link rel="preload" href="fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/tokens.css">

<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name"></span></a>
    <span class="sample-badge" hidden>Sample data</span>

      <ul id="q-list" class="search-list" role="listbox" hidden></ul>
    </div>
    <p class="fresh" aria-live="polite"></p>
  </header>
  <div class="frame">
    <nav class="side" aria-label="Main"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <footer class="foot">
    <p>Prices from auction house scans by our guild members. EU · PvE · Horde<span class="foot-sample" hidden> · Sample data</span></p>
  </footer>
  <nav class="tabs" aria-label="Main"></nav>
