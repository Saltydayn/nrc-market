name: Hourly market job
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: market-hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check R2 secrets
        id: secrets
        env:
          KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -z "$KEY" ]; then echo "No R2 secrets yet, nothing to do."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.secrets.outputs.ok == 'true'
        run: pip install boto3==1.35.*
      - if: steps.secrets.outputs.ok == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python jobs/run.py
